<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>noisy-bench logs</title>
<style>
  body { font-family: ui-monospace, Menlo, monospace; font-size: 13px; margin: 20px; color: #222; }
  nav { margin-bottom: 16px; color: #666; }
  nav a { margin-right: 8px; }
  table { border-collapse: collapse; }
  th, td { padding: 3px 12px 3px 0; text-align: left; border-bottom: 1px solid #e5e5e5; white-space: nowrap; }
  th { border-bottom: 2px solid #999; }
  th.num, td.num { text-align: right; }
  a { color: #0645ad; text-decoration: none; }
  a:hover { text-decoration: underline; }
  pre { background: #f6f6f6; padding: 10px; overflow-x: auto; }
  dl { display: grid; grid-template-columns: max-content auto; gap: 2px 16px; margin: 0 0 16px; }
  dt { color: #666; }
  dd { margin: 0; }
  table.matrix th, table.matrix td { border-left: 1px solid #eee; padding-left: 10px; }
  table.matrix th:first-child, table.matrix td:first-child { border-left: none; padding-left: 0; }
  td.cell { vertical-align: top; }
  td.cell a { display: block; color: inherit; }
  .solved   { color: #1a7f37; }
  .unsolved { color: #b42318; }
  .err      { color: #888; }
  td.sub { color: #666; font-size: 12px; }
  tr.foot td { border-top: 2px solid #999; border-bottom: none; }
  tr.foot + tr.foot td { border-top: none; }
  h3 { font-size: 14px; margin: 22px 0 6px; }
</style>
</head>
<body>
<nav><a href="#/">index</a><a href="#/matrix">matrix</a>
  <span class=sub>| endgame:</span> <a href="#/endgame">index</a><a href="#/endgame/matrix">matrix</a><span id="crumb"></span></nav>
<div id="main">loading…</div>

<script>
const $main  = document.getElementById('main');
const $crumb = document.getElementById('crumb');

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function qs(params) { return new URLSearchParams(params).toString(); }
function avg(xs, f) { return Math.round(xs.reduce((a, x) => a + f(x), 0) / xs.length); }

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}

// ---- index: same aggregation as scripts/status.sh ----
function renderIndex(logs) {
  const groups = new Map();
  for (const l of logs) {
    const k = JSON.stringify([l.model, l.status]);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(l);
  }
  let h = '<table><tr><th>model</th><th>status</th><th class=num>n</th>'
        + '<th class=num>avg_turns</th><th class=num>avg_tokens</th></tr>';
  for (const k of [...groups.keys()].sort()) {
    const xs = groups.get(k);
    const { model, status } = xs[0];
    h += '<tr>'
       + `<td><a href="#/list?${qs({ model })}">${esc(model)}</a></td>`
       + `<td><a href="#/list?${qs({ status })}">${esc(status)}</a></td>`
       + `<td class=num><a href="#/list?${qs({ model, status })}">${xs.length}</a></td>`
       + `<td class=num>${avg(xs, x => x.turns)}</td>`
       + `<td class=num>${avg(xs, x => x.total_gen_tokens)}</td>`
       + '</tr>';
  }
  return h + '</table>';
}

// ---- list: runs filtered by model and/or status ----
function renderList(logs, params) {
  const rows = logs
    .filter(l => (!params.model  || l.model  === params.model)
              && (!params.status || l.status === params.status))
    .sort((a, b) => b.file.localeCompare(a.file));   // newest first
  let h = `<p>${rows.length} runs</p>`
        + '<table><tr><th>started</th><th>model</th><th>status</th>'
        + '<th class=num>turns</th><th class=num>tokens</th><th>secret</th></tr>';
  for (const l of rows) {
    const started = l.file.slice(0, 19);   // YYYY-MM-DDTHH:MM:SS prefix
    h += '<tr>'
       + `<td><a href="#/log/${encodeURIComponent(l.file)}">${esc(started)}</a></td>`
       + `<td>${esc(l.model)}</td><td>${esc(l.status)}</td>`
       + `<td class=num>${l.turns}</td><td class=num>${l.total_gen_tokens}</td>`
       + `<td>${esc(l.secret)}</td>`
       + '</tr>';
  }
  return h + '</table>';
}

// ---- matrix: one row per secret, one column per model ----
function cls(status) {
  return status === 'solved' ? 'solved' : status === 'unsolved' ? 'unsolved' : 'err';
}
function ktok(n) { return (n / 1000).toFixed(1) + 'k'; }

function renderMatrix(logs) {
  // one column per (model, reasoning_effort)
  const colKey = l => JSON.stringify([l.model, l.reasoning_effort]);
  const cols = [...new Set(logs.map(colKey))].sort();

  // secrets in seed order when the log has a sample index, else by value
  const order = new Map();
  for (const l of logs) {
    const idx = l.args && l.args.sample != null ? l.args.sample : Infinity;
    order.set(l.secret, Math.min(idx, order.get(l.secret) ?? Infinity));
  }
  const secrets = [...order.keys()].sort((a, b) => (order.get(a) - order.get(b)) || a.localeCompare(b));

  const cell = new Map();   // "secret|col" -> runs
  for (const l of logs) {
    const k = l.secret + '|' + colKey(l);
    if (!cell.has(k)) cell.set(k, []);
    cell.get(k).push(l);
  }

  let h = '<table class=matrix><tr><th>secret</th>';
  for (const c of cols) {
    const [model, effort] = JSON.parse(c);
    h += `<th>${esc(model)}<br><span class=sub>effort=${esc(effort)}</span></th>`;
  }
  h += '</tr>';
  for (const s of secrets) {
    h += `<tr><td>${esc(s)}</td>`;
    for (const c of cols) {
      const runs = (cell.get(s + '|' + c) || []).sort((a, b) => a.file.localeCompare(b.file));
      h += '<td class=cell>' + runs.map(r => {
        const inv = r.invalid_guesses ? ` inv=${r.invalid_guesses}` : '';
        return `<a class="${cls(r.status)}" href="#/log/${encodeURIComponent(r.file)}">`
             + `${esc(r.status)} ${r.turns}t ${ktok(r.total_gen_tokens)}${inv}</a>`;
      }).join('') + '</td>';
    }
    h += '</tr>';
  }

  // footer: per column, solved / runs and means over solved runs
  const solvedIn = c => logs.filter(l => colKey(l) === c && l.status === 'solved');
  const footRow = (label, f, klass) =>
    `<tr${klass ? ` class=${klass}` : ''}><td class=sub>${label}</td>`
    + cols.map(c => `<td class=sub>${f(c)}</td>`).join('') + '</tr>';
  h += footRow('solved / n', c => `${solvedIn(c).length} / ${logs.filter(l => colKey(l) === c).length}`, 'foot');
  h += footRow('mean turns (solved)',  c => solvedIn(c).length ? avg(solvedIn(c), x => x.turns) : '-');
  h += footRow('mean tokens (solved)', c => solvedIn(c).length ? ktok(avg(solvedIn(c), x => x.total_gen_tokens)) : '-');
  return h + '</table>';
}

// ---- log: one run, one row per turn, with the solver's view of each turn ----
function guessText(t, secret) {
  if (t.corrupted_guess !== undefined) return `${t.guess} -> ${t.corrupted_guess}, ${secret}`;
  if (t.guess !== undefined)           return t.guess;
  return '';
}
function pct(x) { return x === undefined ? '' : (x * 100).toFixed(1) + '%'; }

function renderLog(d, replay) {
  const pos = d.position;                    // present for endgame logs
  const secret = pos ? pos.secret : d.secret;
  let h = '<dl>';
  if (pos) {
    const fg = d.first_guess || {};
    const hdr = {
      model: d.model, status: d.status, band: pos.band, position: pos.id.slice(0, 8), secret,
      reasoning_effort: d.reasoning_effort, p_corruption: pos.p_corruption,
      'solver: support / eff_n': `${pos.stats.support} / ${pos.stats.eff_n}`,
      continuation: modeOf(d) + (modeOf(d) === 'exact' ? ' (history noisy, responses to the model exact)' : ''),
      'solver turns (greedy, noisy continuation)': pos.stats.solver_turns,
      'model turns': d.turns, total_gen_tokens: d.total_gen_tokens, invalid_guesses: d.invalid_guesses,
      'first guess': fg.guess ? `${fg.guess}  P=${pct(fg.p_guess)}  (best ${fg.best} P=${pct(fg.p_best)})` : '',
      source: `${pos.source.model} / ${pos.source.reasoning_effort}, turn ${pos.source.turn}`,
    };
    for (const [k, v] of Object.entries(hdr)) h += `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`;
  } else {
    const fields = ['model', 'status', 'secret', 'reasoning_effort', 'p_corruption',
                    'max_turns', 'turns', 'total_gen_tokens', 'invalid_guesses'];
    for (const f of fields) h += `<dt>${f}</dt><dd>${esc(d[f])}</dd>`;
  }
  h += '</dl>';

  // steps = given history (endgame) followed by the model's own turns; replay rows align 1:1
  const given = pos ? pos.history.map(([g, b, w]) => ({ guess: g, res: `${b} ${w}`, given: true })) : [];
  const steps = given.concat(d.trace);
  const rows = Array.isArray(replay) ? replay : [];
  h += '<table class=matrix><tr><th>#</th><th>guess</th><th>res</th><th class=num>out</th>'
     + '<th class=num>P(guess)</th><th>best</th><th class=num>P(best)</th>'
     + '<th class=num>support</th><th class=num>eff_n</th><th class=num>P(truth)</th><th class=num>rank</th></tr>';
  steps.forEach((t, i) => {
    const r = rows[i] || {};
    let note = '';
    if (t.attempts > 1) note += ` (attempts=${t.attempts})`;
    if (t.status)       note += ` [${t.status}]`;
    if (r.error)        note += ` ${r.error}`;
    const probe = r.p_guess === 0;
    const bestHit = r.best !== undefined && r.best === t.guess;
    if (t.given) {
      h += `<tr class=err><td>${i + 1}</td><td>${esc(t.guess)}</td><td>${esc(t.res)} given</td><td></td>`
         + `<td class=num>${probe ? 'probe' : pct(r.p_guess)}</td><td>${esc(r.best ?? '')}</td><td class=num>${pct(r.p_best)}</td>`
         + `<td class=num>${r.support ?? ''}</td><td class=num>${r.eff_n === undefined ? '' : r.eff_n.toFixed(1)}</td>`
         + `<td class=num>${pct(r.p_truth)}</td><td class=num>${r.rank ?? ''}</td></tr>`;
      return;
    }
    h += '<tr>'
       + `<td>${i + 1}</td>`
       + `<td>${esc(guessText(t, secret))}</td>`
       + `<td>${esc(t.res ?? '')}${esc(note)}</td>`
       + `<td class=num>${t.output_tokens}</td>`
       + `<td class="num ${probe ? 'err' : ''}">${probe ? 'probe' : pct(r.p_guess)}</td>`
       + `<td class="${bestHit ? 'solved' : ''}">${esc(r.best ?? '')}</td>`
       + `<td class=num>${pct(r.p_best)}</td>`
       + `<td class=num>${r.support ?? ''}</td>`
       + `<td class=num>${r.eff_n === undefined ? '' : r.eff_n.toFixed(1)}</td>`
       + `<td class="num ${r.rank === 1 ? 'solved' : ''}">${pct(r.p_truth)}</td>`
       + `<td class="num ${r.rank === 1 ? 'solved' : ''}">${r.rank ?? ''}</td>`
       + '</tr>';
  });
  h += '</table>';
  h += '<p class=sub>P(guess) / best / P(best): the solver\'s posterior <i>before</i> the guess; '
     + '"probe" = the guess had already been ruled out. support / eff_n / P(truth) / rank: <i>after</i> the answer. '
     + 'eff_n = exp(entropy), the number of equally likely candidates that would be just as uncertain.</p>';
  return h;
}

// ---- endgame: aggregate per (model, effort) x band ----
const armOf = l => `${l.model} / ${l.reasoning_effort}`;
const modeOf = l => l.continuation || 'noisy';   // logs from run_endgame.py have no marker
const hit = l => l.first_guess && l.first_guess.guess === l.first_guess.best;
const posLabel = l => `${l.position.band} ${l.position.id.slice(0, 8)} ${l.position.secret}`;

function renderEndgameIndex(logs) {
  const groups = new Map();
  for (const l of logs) {
    const k = JSON.stringify([modeOf(l), l.position.band, armOf(l)]);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(l);
  }
  let h = '<table><tr><th>continuation</th><th>band</th><th>arm</th><th class=num>n</th><th class=num>solved</th>'
        + '<th class=num>1st = best</th><th class=num>1st P/P(best)</th>'
        + '<th class=num>turns</th><th class=num>solver</th><th class=num>extra</th><th class=num>tokens</th></tr>';
  for (const k of [...groups.keys()].sort()) {
    const xs = groups.get(k);
    const [mode, band, arm] = JSON.parse(k);
    const ok = xs.filter(l => l.status === 'solved');
    const scored = xs.filter(l => l.first_guess);
    const ratio = scored.length ? scored.reduce((a, l) => a + l.first_guess.p_guess / l.first_guess.p_best, 0) / scored.length : 0;
    const turns  = xs.reduce((a, l) => a + l.turns, 0) / xs.length;
    const solver = xs.reduce((a, l) => a + l.position.stats.solver_turns, 0) / xs.length;
    h += '<tr>'
       + `<td><a href="#/endgame/matrix?${qs({ mode })}">${esc(mode)}</a></td>`
       + `<td><a href="#/endgame/matrix?${qs({ mode, band })}">${esc(band)}</a></td>`
       + `<td><a href="#/endgame/matrix?${qs({ arm })}">${esc(arm)}</a></td>`
       + `<td class=num><a href="#/endgame/matrix?${qs({ mode, band, arm })}">${xs.length}</a></td>`
       + `<td class=num>${ok.length}</td>`
       + `<td class=num>${scored.length ? pct(scored.filter(hit).length / scored.length) : ''}</td>`
       + `<td class=num>${scored.length ? pct(ratio) : ''}</td>`
       + `<td class=num>${turns.toFixed(2)}</td><td class=num>${solver.toFixed(2)}</td>`
       + `<td class=num>${(turns - solver).toFixed(2)}</td>`
       + `<td class=num>${ktok(avg(xs, l => l.total_gen_tokens))}</td>`
       + '</tr>';
  }
  h += '</table>';
  h += '<p class=sub>1st = best: share of positions where the first guess was the solver\'s top candidate. '
     + '1st P/P(best): mean posterior mass of the first guess relative to the best available. '
     + 'solver: greedy-solver turns from the same positions; extra = turns − solver.</p>';
  return h;
}

// ---- endgame matrix: one row per position, one column per arm ----
const BAND_ORDER = ['forced', 'eff3', 'eff10', 'eff30', 'eff100'];

function renderEndgameMatrix(logs, params) {
  logs = logs.filter(l => (!params.arm || armOf(l) === params.arm) && (!params.band || l.position.band === params.band)
                        && (!params.mode || modeOf(l) === params.mode));
  const cols = [...new Set(logs.map(armOf))].sort();   // same columns in every band's table
  const bands = [...new Set(logs.map(l => l.position.band))]
    .sort((a, b) => (BAND_ORDER.indexOf(a) + 99) % 99 - (BAND_ORDER.indexOf(b) + 99) % 99 || a.localeCompare(b));

  const footRow = (label, f) =>
    `<tr class=foot><td class=sub>${label}</td>` + cols.map(c => `<td class=sub>${f(c)}</td>`).join('') + '</tr>';
  const mean = (xs, f, digits) => xs.length ? (xs.reduce((a, x) => a + f(x), 0) / xs.length).toFixed(digits) : '-';

  let h = `<p>${logs.length} runs</p>`;
  const modes = [...new Set(logs.map(modeOf))].sort();   // 'exact' before 'noisy'
  for (const mode of modes) for (const band of bands) {
    const inBand = logs.filter(l => l.position.band === band && modeOf(l) === mode);
    if (!inBand.length) continue;
    const rowsBy = new Map();
    for (const l of inBand) {
      const k = `${l.position.id.slice(0, 8)} ${l.position.secret}`;
      if (!rowsBy.has(k)) rowsBy.set(k, new Map());
      const cell = rowsBy.get(k);
      if (!cell.has(armOf(l))) cell.set(armOf(l), []);
      cell.get(armOf(l)).push(l);
    }
    h += `<h3>${esc(mode)} continuation &middot; ${esc(band)} <span class=sub>(${rowsBy.size} positions)</span></h3>`;
    h += '<table class=matrix><tr><th>position</th>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';
    for (const k of [...rowsBy.keys()].sort()) {
      h += `<tr><td>${esc(k)}</td>`;
      for (const c of cols) {
        const runs = (rowsBy.get(k).get(c) || []).sort((a, b) => a.file.localeCompare(b.file));
        h += '<td class=cell>' + runs.map(r => {
          const inv = r.invalid_guesses ? ` inv=${r.invalid_guesses}` : '';
          const first = r.first_guess ? (hit(r) ? ' 1st=best' : ` 1st=${pct(r.first_guess.p_guess)}`) : '';
          return `<a class="${cls(r.status)}" href="#/endgame/log/${encodeURIComponent(r.file)}">`
               + `${esc(r.status)} ${r.turns}t/${r.position.stats.solver_turns} ${ktok(r.total_gen_tokens)}${first}${inv}</a>`;
        }).join('') + '</td>';
      }
      h += '</tr>';
    }
    // per-arm aggregates for this band
    const of = c => inBand.filter(l => armOf(l) === c);
    h += footRow('solved / n', c => of(c).length ? `${of(c).filter(l => l.status === 'solved').length} / ${of(c).length}` : '-');
    h += footRow('1st = best', c => { const xs = of(c).filter(l => l.first_guess); return xs.length ? pct(xs.filter(hit).length / xs.length) : '-'; });
    h += footRow('mean turns / solver', c => of(c).length ? `${mean(of(c), l => l.turns, 2)} / ${mean(of(c), l => l.position.stats.solver_turns, 2)}` : '-');
    h += footRow('mean tokens', c => of(c).length ? ktok(+mean(of(c), l => l.total_gen_tokens, 0)) : '-');
    h += '</table>';
  }
  h += '<p class=sub>cell: status, model turns / greedy-solver turns, tokens, first-guess quality.</p>';
  return h;
}

// ---- router ----
async function route() {
  const hash = location.hash || '#/';
  const [path, query] = hash.slice(1).split('?');
  const params = Object.fromEntries(new URLSearchParams(query || ''));
  try {
    if (path.startsWith('/log/')) {
      const file = decodeURIComponent(path.slice(5));
      $crumb.textContent = `/ ${file}`;
      const enc = encodeURIComponent(file);
      const [log, replay] = await Promise.all([fetchJSON(`/logs/${enc}`), fetchJSON(`/api/replay/${enc}`)]);
      $main.innerHTML = renderLog(log, replay);
    } else if (path.startsWith('/endgame/log/')) {
      const file = decodeURIComponent(path.slice('/endgame/log/'.length));
      $crumb.textContent = `/ endgame / ${file}`;
      const enc = encodeURIComponent(file);
      const [log, replay] = await Promise.all([fetchJSON(`/endgame_logs/${enc}`), fetchJSON(`/api/endgame/replay/${enc}`)]);
      $main.innerHTML = renderLog(log, replay);
    } else if (path === '/endgame/matrix') {
      $crumb.textContent = `/ endgame / matrix${params.arm ? ' ' + params.arm : ''}${params.band ? ' ' + params.band : ''}`;
      $main.innerHTML = renderEndgameMatrix(await fetchJSON('/api/endgame/logs'), params);
    } else if (path === '/endgame') {
      $crumb.textContent = '/ endgame';
      $main.innerHTML = renderEndgameIndex(await fetchJSON('/api/endgame/logs'));
    } else if (path === '/matrix') {
      $crumb.textContent = '/ matrix';
      $main.innerHTML = renderMatrix(await fetchJSON('/api/logs'));
    } else if (path === '/list') {
      const parts = [];
      if (params.model)  parts.push(`model=${params.model}`);
      if (params.status) parts.push(`status=${params.status}`);
      $crumb.textContent = `/ ${parts.join(' ') || 'all'}`;
      $main.innerHTML = renderList(await fetchJSON('/api/logs'), params);
    } else {
      $crumb.textContent = '';
      $main.innerHTML = renderIndex(await fetchJSON('/api/logs'));
    }
  } catch (e) {
    $main.innerHTML = `<p>error: ${esc(e.message)}</p>`;
  }
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
